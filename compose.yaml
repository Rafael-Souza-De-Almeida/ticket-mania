services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=ticket-mania-db'
      - 'POSTGRES_PASSWORD=password'
      - 'POSTGRES_USER=admin'
    ports:
      - '5432:5432'

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
